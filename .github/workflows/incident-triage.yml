name: Incident Triage Agent

# Runs when the incident detector opens an `auto-incident` issue.
# Uses OpenRouter / Groq / Gemini via .github/agents/run_agent.py (read-only).

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to (re)triage"
        required: true

concurrency:
  group: incident-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'auto-incident')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '"Title: " + .title + "\n\n" + .body' > "$RUNNER_TEMP/issue.md"
          {
            cat .github/agents/triage.md
            echo
            echo "<incident_issue number=\"$ISSUE_NUMBER\">"
            cat "$RUNNER_TEMP/issue.md"
            echo
            echo "</incident_issue>"
          } > "$RUNNER_TEMP/prompt.md"

      - name: Run Triage Agent (read-only)
        id: agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
        run: |
          python3 .github/agents/run_agent.py \
            --mode triage \
            --prompt-file "$RUNNER_TEMP/prompt.md" \
            --output "$RUNNER_TEMP/summary.md"

      - name: Post triage comment and labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.ISSUE_NUMBER);
            let summary = '';
            try {
              summary = fs.readFileSync(`${process.env.RUNNER_TEMP}/summary.md`, 'utf8');
            } catch (_) {}

            let severity = 'P2';
            let fixable = false;
            const m = summary.match(/TRIAGE_RESULT:\s*(\{[^\n]*\})\s*$/m);
            if (m) {
              try {
                const r = JSON.parse(m[1]);
                if (['P1', 'P2', 'P3'].includes(r.severity)) severity = r.severity;
                fixable = r.fixable === true;
              } catch (e) { core.warning(`Bad TRIAGE_RESULT: ${e}`); }
              summary = summary.replace(m[0], '').trim();
            } else {
              core.warning('No TRIAGE_RESULT line found; defaulting to needs-human.');
            }

            summary = summary.replace(/@/g, '@\u200b').slice(0, 60000);

            const verdict = fixable
              ? '✅ **agent-fixable**: add the `agent-fix` label to let the fix agent open a draft PR.'
              : '🧑‍🔧 **needs-human**: not a safe automated fix.';

            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: `## 🤖 Incident Triage\n\n${summary || '_No analysis produced._'}\n\n---\n**Severity:** ${severity} · ${verdict}`,
            });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number,
              labels: ['triaged', `severity:${severity}`, fixable ? 'agent-fixable' : 'needs-human'],
            });
