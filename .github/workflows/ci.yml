name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and linters
        run: pip install -r backend/requirements.txt pytest pytest-asyncio ruff

      - name: Static analysis (undefined names & syntax checks)
        run: ruff check --select F,E9 --ignore F401,F541,F841 backend/

      - name: Entrypoint import smoke test
        env:
          PYTHONPATH: backend
        run: |
          python -c "import app.main, websocket_app, worker, incident_worker; print('All backend entrypoints imported cleanly')"

      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -c backend/pytest.ini backend/tests/ais -q

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
